
<script>
const API = "https://video-downloader-api.koinklub.workers.dev";

const $ = id => document.getElementById(id);

let polling = false;
let lastProgress = null;
let lastProgressTime = null;
let progressRate = null;

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) {
    return "Belum tersedia";
  }

  seconds = Math.ceil(seconds);

  if (seconds < 60) return seconds + " detik";

  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) {
    return minutes + " menit " + (seconds % 60) + " detik";
  }

  return Math.floor(minutes / 60) + " jam " +
    (minutes % 60) + " menit";
}

function updateEstimate(progress) {
  const now = Date.now();

  if (lastProgress === null) {
    lastProgress = progress;
    lastProgressTime = now;
    $("estimate").textContent = "Menghitung...";
    return;
  }

  if (progress > lastProgress) {
    const elapsed = (now - lastProgressTime) / 1000;
    const gained = progress - lastProgress;

    if (elapsed > 0) {
      const rate = gained / elapsed;
      progressRate = progressRate === null
        ? rate
        : progressRate * 0.5 + rate * 0.5;
    }

    lastProgress = progress;
    lastProgressTime = now;
  }

  if (progress >= 100) {
    $("estimate").textContent = "Selesai";
  } else if (
    progressRate &&
    progressRate > 0 &&
    now - lastProgressTime < 120000
  ) {
    $("estimate").textContent =
      formatTime((100 - progress) / progressRate);
  } else {
    $("estimate").textContent = "Proses masih berjalan...";
  }
}

function updateProgress(data) {
  const progress = Math.max(
    0,
    Math.min(100, Number(data.progress) || 0)
  );

  $("progressFill").style.width = progress + "%";
  $("percent").textContent = progress + "%";
  $("statusMessage").textContent =
    data.message || "Sedang diproses...";

  $("statusTitle").textContent =
    data.status === "uploading" ? "Mengunggah hasil..." :
    data.status === "downloading" ? "Mengunduh video..." :
    data.status === "processing" ? "Memproses video..." :
    "Sedang berjalan...";

  updateEstimate(progress);
}

function showError(message) {
  $("statusBox").style.display = "block";
  $("statusTitle").textContent = "Terjadi kesalahan";
  $("statusTitle").classList.add("error");
  $("statusMessage").textContent = message;
  $("estimate").textContent = "Tidak tersedia";
}

function resetButton() {
  polling = false;
  $("downloadBtn").disabled = false;
  $("downloadBtn").textContent = "DOWNLOAD SEKARANG";
}

async function startDownload() {
  if (polling) return;

  const url = $("videoUrl").value.trim();
  const format = document.querySelector(
    'input[name="format"]:checked'
  ).value;

  if (!url) {
    alert("Masukkan link video terlebih dahulu.");
    return;
  }

  try {
    new URL(url);
  } catch {
    alert("Link video tidak valid.");
    return;
  }

  polling = true;
  lastProgress = null;
  lastProgressTime = null;
  progressRate = null;

  const requestId = crypto.randomUUID();

  $("downloadBtn").disabled = true;
  $("downloadBtn").textContent = "SEDANG MEMPROSES...";
  $("statusBox").style.display = "block";
  $("result").style.display = "none";
  $("statusTitle").classList.remove("error");
  $("statusTitle").textContent = "Mengirim permintaan...";
  $("statusMessage").textContent = "Menghubungkan ke server...";
  $("estimate").textContent = "Menghitung...";
  $("progressFill").style.width = "0%";
  $("percent").textContent = "0%";

  try {
    const response = await fetch(API + "/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        video_url: url,
        format: format,
        resolution: "best",
        request_id: requestId
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || result.message || "Permintaan ditolak server."
      );
    }

    const id = result.id || result.request_id || requestId;

    await checkStatus(id);

  } catch (error) {
    showError(error.message || "Koneksi server gagal.");
    resetButton();
  }
}

async function checkStatus(id) {
  const started = Date.now();
  const maxDuration = 60 * 60 * 1000;

  while (Date.now() - started < maxDuration) {
    const response = await fetch(
      API + "/status?id=" + encodeURIComponent(id),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Gagal membaca status.");
    }

    updateProgress(data);

    if (data.status === "completed") {
      $("progressFill").style.width = "100%";
      $("percent").textContent = "100%";
      $("statusTitle").textContent = "Video berhasil diproses!";
      $("statusMessage").textContent = "File siap diunduh.";
      $("estimate").textContent = "Selesai";

      if (!data.download_url) {
        throw new Error("Video selesai, tetapi link download belum tersedia.");
      }

      $("downloadLink").href = data.download_url;
      $("result").style.display = "block";

      resetButton();
      return;
    }

    if (data.status === "failed" || data.status === "error") {
      throw new Error(data.message || "Proses download gagal.");
    }

    await new Promise(resolve => setTimeout(resolve, 5000));
  }

  throw new Error("Waktu tunggu habis. Periksa GitHub Actions.");
}
</script>
