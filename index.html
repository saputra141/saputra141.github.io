
<script>
const WORKER_URL = "GANTI_DENGAN_URL_WORKER_CLOUDFLARE";

async function downloadVideo() {
  const url = document.getElementById("videoUrl").value.trim();
  const format = document.querySelector('input[name="format"]:checked').value;
  const status = document.getElementById("status");

  if (!url) {
    status.textContent = "Masukkan link video terlebih dahulu.";
    return;
  }

  status.textContent = "Mengirim permintaan download...";

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        video_url: url,
        format: format
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "Permintaan gagal.");
    }

    status.textContent =
      "Permintaan berhasil dikirim! Periksa GitHub Actions untuk hasilnya.";
  } catch (error) {
    status.textContent = "Gagal: " + error.message;
  }
}
</script>
