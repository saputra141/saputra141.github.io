<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:25px 15px;
  background:#071426;color:white;
  font-family:Arial,sans-serif;
}
.container{
  max-width:480px;margin:45px auto;
  padding:25px;background:#10233e;
  border-radius:16px;
}
h1{text-align:center;margin-top:0}
p{text-align:center;color:#b8c8dc}
input,select,button{
  width:100%;padding:15px;margin-top:14px;
  border-radius:9px;border:0;font-size:16px;
}
input,select{background:#fff;color:#111}
button{
  background:#087cf0;color:white;
  font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.result{
  display:none;margin-top:20px;
  padding:15px;background:#0a392d;
  border-radius:10px;text-align:center;
}
.result a{
  display:block;padding:15px;
  background:#13a36f;color:white;
  border-radius:9px;text-decoration:none;
  font-weight:bold;margin-top:12px;
}
#status{
  text-align:center;margin-top:18px;
  color:#ffd36a;font-size:14px;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<div class="container">
  <h1>VIDEO DOWNLOADER</h1>
  <p>Instagram • Facebook • TikTok</p>

  <input id="videoUrl" type="url"
    placeholder="Tempel link video di sini">

  <select id="format">
    <option value="mp4">MP4 - Video</option>
    <option value="mp3">MP3 - Audio</option>
  </select>

  <button id="downloadBtn" onclick="startDownload()">
    DOWNLOAD
  </button>

  <div id="status"></div>

  <div class="result" id="result">
    <strong>File siap diunduh!</strong>
    <a id="downloadLink" href="#" target="_blank" rel="noopener">
      UNDUH VIDEO
    </a>
  </div>
</div>

<script>
const API = "https://video-downloader-api.koinklub.workers.dev/";

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

async function startDownload(){
  const url = document.getElementById("videoUrl").value.trim();
  const format = document.getElementById("format").value;
  const btn = document.getElementById("downloadBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const link = document.getElementById("downloadLink");

  result.style.display = "none";

  if(!url){
    status.textContent = "Masukkan link video terlebih dahulu.";
    return;
  }

  btn.disabled = true;
  status.textContent = "Mengirim permintaan...";

  const requestId = crypto.randomUUID();

  try{
    const response = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        mode:"download",
        video_url:url,
        format:format,
        resolution:"best",
        request_id:requestId
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || data.message || "Gagal mengirim permintaan.");
    }

    status.textContent = "Sedang memproses video...";

    for(let i=0;i<90;i++){
      await sleep(5000);

      const check = await fetch(
        API + "status?id=" + encodeURIComponent(requestId)
      );

      const info = await check.json();

      if(!check.ok){
        throw new Error(info.error || "Gagal memeriksa status.");
      }

      if(info.download_url){
        link.href = info.download_url;
        link.textContent = format === "mp3"
          ? "UNDUH AUDIO"
          : "UNDUH VIDEO";

        result.style.display = "block";
        status.textContent = "Selesai! File sudah tersedia.";
        return;
      }

      if(info.status === "failed" || info.error){
        throw new Error(info.error || "Proses download gagal.");
      }

      status.textContent =
        "Sedang memproses video... (" + (i+1) + ")";
    }

    throw new Error("Waktu proses habis. Silakan coba lagi.");

  }catch(error){
    status.textContent = "Gagal: " + error.message;
  }finally{
    btn.disabled = false;
  }
}
</script>

</body>
</html>
