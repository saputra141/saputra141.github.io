
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071426;color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:430px;background:#10243d;padding:28px 22px;border-radius:18px;box-shadow:0 10px 35px #0005}
h1{text-align:center;margin:0 0 8px;font-size:27px}
.sub{text-align:center;color:#a9bdd4;margin-bottom:28px}
input[type=url]{width:100%;padding:16px;border:1px solid #49617c;border-radius:10px;background:#071426;color:white;font-size:15px;outline:none}
.formats{display:flex;gap:25px;justify-content:center;margin:22px 0}
.formats label{cursor:pointer}
button{width:100%;padding:16px;border:0;border-radius:10px;background:#1685ef;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#status{text-align:center;margin-top:20px;line-height:1.5;color:#d6e5f5;overflow-wrap:anywhere}
#status a{color:#55c5ff}
</style>
</head>
<body>
<div class="container">
<h1>Video Downloader</h1>
<div class="sub">Instagram • Facebook • TikTok</div>

<input id="videoUrl" type="url" placeholder="Tempel link video di sini">

<div class="formats">
<label><input type="radio" name="format" value="mp4" checked> MP4 Video</label>
<label><input type="radio" name="format" value="mp3"> MP3 Audio</label>
</div>

<button id="downloadBtn" onclick="startDownload()">DOWNLOAD</button>
<div id="status"></div>
</div>

<script>
const API = "https://video-downloader-api.koinklub.workers.dev/";

const button = document.getElementById("downloadBtn");
const statusBox = document.getElementById("status");
const urlInput = document.getElementById("videoUrl");

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

async function startDownload(){
  const videoUrl = urlInput.value.trim();
  const format = document.querySelector('input[name="format"]:checked').value;

  if(!videoUrl){
    statusBox.textContent = "Masukkan link video terlebih dahulu.";
    return;
  }

  button.disabled = true;
  button.textContent = "MEMPROSES...";
  statusBox.textContent = "Mengirim permintaan download...";

  try{
    const response = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        video_url:videoUrl,
        format:format
      })
    });

    const data = await response.json();

    if(!response.ok || !data.success || !data.id){
      throw new Error(data.error || "Gagal mengirim permintaan.");
    }

    statusBox.textContent = "Video sedang diproses. Mohon tunggu...";

    const id = data.id;
    const deadline = Date.now() + 30 * 60 * 1000;

    while(Date.now() < deadline){
      await wait(5000);

      const check = await fetch(
        API + "status?id=" + encodeURIComponent(id),
        {cache:"no-store"}
      );

      if(!check.ok) continue;

      const result = await check.json();

      if(result.status === "completed"){
        statusBox.textContent = "Download selesai! Mengunduh file...";

        const downloadUrl = API + "download?id=" + encodeURIComponent(id);

        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = "";
        document.body.appendChild(link);
        link.click();
        link.remove();

        statusBox.innerHTML =
          'Jika download tidak otomatis dimulai, <a href="' +
          downloadUrl +
          '">tekan di sini untuk mengunduh</a>.';

        return;
      }

      if(result.status === "failed"){
        throw new Error(result.error || "Video gagal diproses.");
      }

      statusBox.textContent = "Video sedang diproses. Mohon tunggu...";
    }

    throw new Error("Waktu proses terlalu lama. Silakan coba lagi.");

  }catch(error){
    statusBox.textContent = "Gagal: " + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "DOWNLOAD";
  }
}
</script>
</body>
</html>
