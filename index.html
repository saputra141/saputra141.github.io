
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #071b3a, #123d72);
    }
    .container {
      width: 100%;
      max-width: 440px;
      padding: 28px 22px;
      border-radius: 18px;
      background: #102b50;
      box-shadow: 0 12px 35px #0005;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .subtitle {
      text-align: center;
      color: #b9cce5;
      margin-bottom: 28px;
    }
    input[type="url"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #54749b;
      border-radius: 10px;
      background: #071b32;
      color: white;
      font-size: 15px;
      outline: none;
    }
    .formats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 22px 0;
    }
    button, .download-link {
      display: block;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #1687f8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
      color: #d6e7ff;
    }
    #downloadArea { margin-top: 18px; }
    .download-link { background: #16a36a; }
    .small {
      color: #9fb7d3;
      font-size: 12px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Video Downloader</h1>
    <div class="subtitle">Instagram • Facebook • TikTok</div>

    <form id="downloadForm">
      <input
        id="videoUrl"
        type="url"
        placeholder="Tempel link video di sini"
        required
      >

      <div class="formats">
        <label><input type="radio" name="format" value="mp4" checked> MP4 Video</label>
        <label><input type="radio" name="format" value="mp3"> MP3 Audio</label>
      </div>

      <button id="submitButton" type="submit">DOWNLOAD</button>
    </form>

    <div id="status" role="status"></div>
    <div id="downloadArea"></div>

    <div class="small">
      Unduh hanya konten yang kamu miliki atau sudah mendapat izin pemiliknya.
    </div>
  </main>

  <script>
    const API = "https://video-downloader-api.koinklub.workers.dev";

    const form = document.getElementById("downloadForm");
    const button = document.getElementById("submitButton");
    const statusBox = document.getElementById("status");
    const downloadArea = document.getElementById("downloadArea");

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function showDownload(id) {
      const link = document.createElement("a");
      link.className = "download-link";
      link.href = `${API}/download?id=${encodeURIComponent(id)}`;
      link.textContent = "DOWNLOAD VIDEO";
      link.setAttribute("download", "");

      downloadArea.replaceChildren(link);
    }

    async function checkStatus(id) {
      const started = Date.now();

      while (Date.now() - started < 30 * 60 * 1000) {
        await new Promise(resolve => setTimeout(resolve, 5000));

        try {
          const response = await fetch(
            `${API}/status?id=${encodeURIComponent(id)}`
          );

          if (!response.ok) {
            throw new Error("Gagal memeriksa status.");
          }

          const result = await response.json();

          if (result.status === "completed") {
            showStatus("Video selesai diproses!");
            showDownload(id);
            button.disabled = false;
            button.textContent = "DOWNLOAD LAGI";
            return;
          }

          showStatus("Sedang memproses video... Mohon tunggu.");
        } catch (error) {
          showStatus(error.message);
          button.disabled = false;
          button.textContent = "COBA LAGI";
          return;
        }
      }

      showStatus("Waktu tunggu habis. Periksa GitHub Actions.");
      button.disabled = false;
      button.textContent = "COBA LAGI";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const videoUrl = document.getElementById("videoUrl").value.trim();
      const format = document.querySelector(
        'input[name="format"]:checked'
      ).value;

      button.disabled = true;
      button.textContent = "MENGIRIM...";
      downloadArea.replaceChildren();
      showStatus("Mengirim permintaan...");

      try {
        const response = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            video_url: videoUrl,
            format: format
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success || !result.id) {
          throw new Error(result.error || "Permintaan gagal dikirim.");
        }

        showStatus("Permintaan diterima. Sedang memproses video...");
        await checkStatus(result.id);

      } catch (error) {
        showStatus("Gagal: " + error.message);
        button.disabled = false;
        button.textContent = "COBA LAGI";
      }
    });
  </script>
</body>
</html>
