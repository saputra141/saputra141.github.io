
name: Download Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect atau download"
        required: true
        type: choice
        options:
          - inspect
          - download
      video_url:
        description: "Link video"
        required: true
        type: string
      format:
        description: "Format hasil"
        required: true
        type: choice
        options:
          - mp4
          - mp3
      resolution:
        description: "Resolusi video"
        required: true
        default: best
        type: string
      request_id:
        description: "ID permintaan"
        required: true
        type: string

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp

      - name: Inspect video resolutions
        if: inputs.mode == 'inspect'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          yt-dlp --dump-single-json --no-warnings "$VIDEO_URL" > info.json

          python - <<'PY'
          import json, os

          with open("info.json", encoding="utf-8") as f:
              info = json.load(f)

          heights = sorted({
              x["height"]
              for x in info.get("formats", [])
              if x.get("height") and x.get("vcodec") != "none"
          }, reverse=True)

          result = {
              "status": "completed",
              "mode": "inspect",
              "formats": heights,
              "title": info.get("title", "Video")
          }

          with open("result.json", "w", encoding="utf-8") as f:
              json.dump(result, f)
          PY

          TAG="download-${REQUEST_ID}"
          META="$(cat result.json)"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$META" \
            --target main

      - name: Download selected video
        if: inputs.mode == 'download'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          FORMAT: ${{ inputs.format }}
          RESOLUTION: ${{ inputs.resolution }}
        shell: bash
        run: |
          set -e

          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp \
              -x \
              --audio-format mp3 \
              --audio-quality 0 \
              -o "output.%(ext)s" \
              "$VIDEO_URL"
          else
            if [ "$RESOLUTION" = "best" ]; then
              SELECTOR="bestvideo+bestaudio/best"
            else
              SELECTOR="bestvideo[height<=${RESOLUTION}]+bestaudio/best[height<=${RESOLUTION}]"
            fi

            yt-dlp \
              -f "$SELECTOR" \
              --remux-video mp4 \
              -o "output.%(ext)s" \
              "$VIDEO_URL"
          fi

          FILE=$(find . -maxdepth 1 -type f \
            \( -name 'output.mp4' -o -name 'output.mp3' \) | head -n 1)

          test -n "$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "FILENAME=$(basename "$FILE")" >> "$GITHUB_ENV"

      - name: Publish direct MP4 or MP3 file
        if: inputs.mode == 'download'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ github.token }}
          FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json, os

          result = {
              "status": "completed",
              "mode": "download",
              "filename": os.environ["FILENAME"],
              "format": os.environ["FORMAT"]
          }

          with open("result.json", "w", encoding="utf-8") as f:
              json.dump(result, f)
          PY

          TAG="download-${REQUEST_ID}"
          META="$(cat result.json)"

          gh release create "$TAG" "$FILE" \
            --title "$TAG" \
            --notes "$META" \
            --target main
