
name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL video"
        required: true
        type: string
      format:
        description: "Format"
        required: true
        type: choice
        options:
          - mp4
          - mp3
      resolution:
        description: "Resolusi"
        required: false
        default: "best"
        type: string
      request_id:
        description: "Request ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Prepare
        shell: bash
        run: |
          echo "TAG=download-${{ inputs.request_id }}" >> "$GITHUB_ENV"
          echo "FORMAT=${{ inputs.format }}" >> "$GITHUB_ENV"
          echo "VIDEO_URL=${{ inputs.video_url }}" >> "$GITHUB_ENV"
          echo "RESOLUTION=${{ inputs.resolution }}" >> "$GITHUB_ENV"

      - name: Remove old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes || true
          git push origin --delete "$TAG" || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --title "Video Download" \
            --notes '{"status":"queued","progress":5,"message":"Permintaan diterima"}'

      - name: Update status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --notes '{"status":"processing","progress":20,"message":"Sedang mengunduh video"}'

      - name: Download MP4
        if: inputs.format == 'mp4'
        run: |
          yt-dlp \
            -f "bv*+ba/b" \
            --merge-output-format mp4 \
            -o "hasil.%(ext)s" \
            "$VIDEO_URL"

          FILE=$(find . -maxdepth 1 -type f \
            \( -name "hasil.mp4" -o -name "hasil.mkv" -o -name "hasil.webm" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "File video tidak ditemukan"
            exit 1
          fi

          ffmpeg -y -i "$FILE" -c copy hasil.mp4
          rm -f "$FILE"

      - name: Download MP3
        if: inputs.format == 'mp3'
        run: |
          yt-dlp \
            -x \
            --audio-format mp3 \
            --audio-quality 0 \
            -o "hasil.%(ext)s" \
            "$VIDEO_URL"

          test -f hasil.mp3

      - name: Update uploading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --notes '{"status":"uploading","progress":80,"message":"Mengunggah file"}'

      - name: Upload result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$FORMAT" = "mp4" ]; then
            FILE="hasil.mp4"
          else
            FILE="hasil.mp3"
          fi

          test -f "$FILE"

          gh release upload "$TAG" "$FILE" --clobber

      - name: Verify uploaded asset
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --json assets > assets.json

          if [ "$FORMAT" = "mp4" ]; then
            FILE="hasil.mp4"
          else
            FILE="hasil.mp3"
          fi

          URL=$(jq -r --arg file "$FILE" \
            '.assets[] | select(.name == $file) | .url' assets.json)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Asset tidak ditemukan di Release"
            cat assets.json
            exit 1
          fi

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"

          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"

      - name: Mark completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg url "$DOWNLOAD_URL" \
            '{status:"completed",progress:100,message:"File siap diunduh!",download_url:$url}' \
            > status.json

          gh release edit "$TAG" --notes-file status.json

      - name: Mark failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --notes '{"status":"failed","progress":0,"message":"Download gagal"}' || true
