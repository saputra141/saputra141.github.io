name: Download Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect atau download"
        required: true
        type: choice
        options:
          - inspect
          - download
        default: download

      video_url:
        description: "Link video"
        required: true
        type: string

      format:
        description: "Format hasil"
        required: true
        type: choice
        options:
          - mp4
          - mp3
        default: mp4

      resolution:
        description: "Resolusi video"
        required: true
        type: string
        default: best

      request_id:
        description: "ID permintaan"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp

      - name: Prepare variables
        shell: bash
        run: |
          echo "TAG=download-${{ inputs.request_id }}" >> "$GITHUB_ENV"
          echo "MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          echo "FORMAT=${{ inputs.format }}" >> "$GITHUB_ENV"
          echo "RESOLUTION=${{ inputs.resolution }}" >> "$GITHUB_ENV"
          echo "VIDEO_URL=${{ inputs.video_url }}" >> "$GITHUB_ENV"

      - name: Inspect video
        if: inputs.mode == 'inspect'
        shell: bash
        run: |
          yt-dlp --no-warnings -J "$VIDEO_URL" > info.json

          python - <<'PY'
          import json
          data = json.load(open("info.json"))
          formats = []
          seen = set()

          for f in data.get("formats", []):
              h = f.get("height")
              if h and f.get("vcodec") != "none" and h not in seen:
                  seen.add(h)
                  formats.append({
                      "height": h,
                      "label": f"{h}p"
                  })

          formats.sort(key=lambda x: x["height"], reverse=True)

          result = {
              "mode": "inspect",
              "formats": formats,
              "title": data.get("title", "")
          }

          json.dump(result, open("result.json", "w"))
          PY

          gh release create "$TAG" \
            result.json \
            --title "$TAG" \
            --notes "$(cat result.json)" \
            --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download video
        if: inputs.mode == 'download'
        shell: bash
        run: |
          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp \
              -x \
              --audio-format mp3 \
              --no-playlist \
              -o "output.%(ext)s" \
              "$VIDEO_URL"
          else
            if [ "$RESOLUTION" = "best" ]; then
              SELECTOR="bv*+ba/b"
            else
              SELECTOR="bv*[height<=${RESOLUTION}]+ba/b[height<=${RESOLUTION}]"
            fi

            yt-dlp \
              -f "$SELECTOR" \
              --merge-output-format mp4 \
              --no-playlist \
              -o "output.%(ext)s" \
              "$VIDEO_URL"
          fi

          FILE=$(find . -maxdepth 1 -type f \
            \( -name "output.mp4" -o -name "output.mp3" -o -name "output.mkv" -o -name "output.webm" \) \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "File hasil tidak ditemukan"
            exit 1
          fi

          echo "OUTPUT_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Publish download
        if: inputs.mode == 'download'
        shell: bash
        run: |
          printf '{"mode":"download","format":"%s","status":"completed"}' "$FORMAT" > result.json

          gh release create "$TAG" \
            "$OUTPUT_FILE" \
            --title "$TAG" \
            --notes "$(cat result.json)" \
            --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
