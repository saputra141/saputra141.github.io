name: All-in-One Social Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste Instagram, Facebook, or TikTok URL"
        required: true
        type: string

      resolution:
        description: "Choose maximum resolution"
        required: true
        type: choice
        default: "1080"
        options:
          - "1080"
          - "720"
          - "480"
          - "360"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Validate URL
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["VIDEO_URL"].strip()
          host = (urlparse(url).hostname or "").lower()

          allowed = {
              "instagram.com",
              "www.instagram.com",
              "facebook.com",
              "www.facebook.com",
              "m.facebook.com",
              "fb.watch",
              "tiktok.com",
              "www.tiktok.com",
              "vm.tiktok.com",
              "vt.tiktok.com"
          }

          if urlparse(url).scheme != "https" or host not in allowed:
              raise SystemExit("Unsupported or invalid URL")

          print("URL accepted")
          PY

      - name: Download video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          mkdir -p source downloads

          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -f "best[height<=${RESOLUTION}]/best" \
            -o "source/video.%(ext)s" \
            "$VIDEO_URL"

          FILE=$(find source -maxdepth 1 -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Video not found"
            exit 1
          fi

          ffmpeg -y -i "$FILE" \
            -vf "scale=-2:'min(ih,${RESOLUTION})'" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -movflags +faststart \
            downloads/video.mp4

          echo "Download and conversion completed"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/video.mp4
          if-no-files-found: error
          retention-days: 1
