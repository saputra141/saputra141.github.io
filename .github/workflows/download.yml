name: All-in-One Social Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Paste Instagram, Facebook, or TikTok URL"
        required: true
        type: string

      format:
        description: "Choose download format"
        required: true
        type: choice
        default: "mp4"
        options:
          - "mp4"
          - "mp3"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp

      - name: Validate URL
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["VIDEO_URL"].strip()
          host = (urlparse(url).hostname or "").lower()

          allowed = {
              "instagram.com", "www.instagram.com",
              "facebook.com", "www.facebook.com",
              "m.facebook.com", "fb.watch",
              "tiktok.com", "www.tiktok.com",
              "vm.tiktok.com", "vt.tiktok.com"
          }

          if urlparse(url).scheme != "https" or host not in allowed:
              raise SystemExit("Unsupported URL")

          print("URL accepted")
          PY

      - name: Download MP4
        if: inputs.format == 'mp4'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p downloads

          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -f "bestvideo+bestaudio/best" \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

      - name: Download MP3
        if: inputs.format == 'mp3'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p downloads

          yt-dlp \
            --no-playlist \
            -x \
            --audio-format mp3 \
            --audio-quality 0 \
            -o "downloads/%(extractor)s-%(id)s.%(ext)s" \
            "$VIDEO_URL"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-${{ inputs.format }}
          path: downloads/*
          if-no-files-found: error
          retention-days: 1
