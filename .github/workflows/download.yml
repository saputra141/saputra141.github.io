name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL video"
        required: true
        type: string
      format:
        description: "Format"
        required: true
        type: choice
        options:
          - mp4
          - mp3
      resolution:
        description: "Resolusi"
        required: false
        default: "best"
        type: string
      request_id:
        description: "Request ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade yt-dlp

      - name: Prepare request
        shell: bash
        run: |
          echo "TAG=download-${{ inputs.request_id }}" >> "$GITHUB_ENV"
          echo "FORMAT=${{ inputs.format }}" >> "$GITHUB_ENV"
          echo "VIDEO_URL=${{ inputs.video_url }}" >> "$GITHUB_ENV"
          echo "RESOLUTION=${{ inputs.resolution }}" >> "$GITHUB_ENV"

      - name: Remove old release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes || true
          git push origin --delete "$TAG" || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES='{"status":"queued","progress":5,"message":"Permintaan diterima"}'
          gh release create "$TAG" \
            --title "Download ${{ inputs.request_id }}" \
            --notes "$NOTES"

      - name: Update processing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --notes '{"status":"processing","progress":10,"message":"Memulai proses"}'

      - name: Download video
        shell: bash
        run: |
          mkdir -p output

          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp \
              -x \
              --audio-format mp3 \
              -o "output/%(title).80s.%(ext)s" \
              "$VIDEO_URL"
          else
            if [ "$RESOLUTION" = "best" ]; then
              SELECTOR="bv*+ba/b"
            else
              SELECTOR="bv*[height<=${RESOLUTION}]+ba/b"
            fi

            yt-dlp \
              -f "$SELECTOR" \
              --merge-output-format mp4 \
              -o "output/%(title).80s.%(ext)s" \
              "$VIDEO_URL"
          fi

      - name: Update uploading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --notes '{"status":"uploading","progress":80,"message":"Mengunggah hasil"}'

      - name: Upload result
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          FILE=$(find output -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "File hasil tidak ditemukan"
            exit 1
          fi

          gh release upload "$TAG" "$FILE"

          FILE_NAME=$(basename "$FILE")
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE_NAME}"

          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"

      - name: Update completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n \
            --arg url "$DOWNLOAD_URL" \
            '{status:"completed",progress:100,message:"Selesai",download_url:$url}' \
            > status.json

          gh release edit "$TAG" --notes-file status.json

      - name: Mark failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$TAG" \
            --notes '{"status":"failed","progress":0,"message":"Download gagal"}' || true
