name: All-in-One Social Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Link video"
        required: true
        type: string
      format:
        description: "Format"
        required: true
        type: choice
        options:
          - mp4
          - mp3
      request_id:
        description: "Request ID"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U yt-dlp awscli

      - name: Download video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          FORMAT: ${{ inputs.format }}
        run: |
          mkdir -p downloads

          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp --no-playlist \
              -x --audio-format mp3 \
              -o "downloads/%(title).80s.%(ext)s" \
              "$VIDEO_URL"
          else
            yt-dlp --no-playlist \
              -f "bv*+ba/b" \
              --merge-output-format mp4 \
              -o "downloads/%(title).80s.%(ext)s" \
              "$VIDEO_URL"
          fi

      - name: Upload video and metadata to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          FILE=$(find downloads -maxdepth 1 -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "File hasil download tidak ditemukan"
            exit 1
          fi

          NAME=$(basename "$FILE")
          KEY="downloads/${REQUEST_ID}/${NAME}"

          if [[ "$FILE" == *.mp3 ]]; then
            CONTENT_TYPE="audio/mpeg"
          else
            CONTENT_TYPE="video/mp4"
          fi

          aws s3 cp "$FILE" "s3://${R2_BUCKET}/${KEY}" \
            --endpoint-url "$R2_ENDPOINT"

          export KEY NAME CONTENT_TYPE

          python - <<'PY'
          import json, os

          data = {
              "status": "completed",
              "key": os.environ["KEY"],
              "filename": os.environ["NAME"],
              "content_type": os.environ["CONTENT_TYPE"]
          }

          with open("job.json", "w") as f:
              json.dump(data, f)
          PY

          aws s3 cp job.json \
            "s3://${R2_BUCKET}/jobs/${REQUEST_ID}.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json"

          echo "UPLOAD BERHASIL"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: hasil-download
          path: downloads/
          retention-days: 1
