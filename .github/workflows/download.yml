
name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Link video"
        required: true
        type: string
      format:
        description: "Format hasil"
        required: true
        type: choice
        options:
          - mp4
          - mp3
      resolution:
        description: "Resolusi"
        required: true
        type: string
        default: best
      request_id:
        description: "ID permintaan"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq pipx
          pipx install yt-dlp

      - name: Prepare
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          echo "TAG=download-${REQUEST_ID}" >> "$GITHUB_ENV"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: download-${{ inputs.request_id }}
        run: |
          NOTES='{"status":"queued","progress":5,"message":"Permintaan diterima"}'

          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Download and publish file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: download-${{ inputs.request_id }}
          VIDEO_URL: ${{ inputs.video_url }}
          FORMAT: ${{ inputs.format }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          update_status() {
            NOTES=$(jq -nc \
              --arg status "$1" \
              --argjson progress "$2" \
              --arg message "$3" \
              '{status:$status,progress:$progress,message:$message}')

            gh release edit "$TAG" --notes "$NOTES"
          }

          fail_status() {
            CODE=$?
            if [ "$CODE" -ne 0 ]; then
              NOTES=$(jq -nc \
                '{status:"failed",progress:0,message:"Download gagal. Periksa log GitHub Actions."}')
              gh release edit "$TAG" --notes "$NOTES" || true
            fi
            exit "$CODE"
          }

          trap fail_status EXIT

          update_status "processing" 10 "Menyiapkan video"

          if [ "$FORMAT" = "mp3" ]; then
            update_status "downloading" 20 "Mengunduh audio"

            yt-dlp \
              -x \
              --audio-format mp3 \
              --no-playlist \
              -o "output.%(ext)s" \
              "$VIDEO_URL"
          else
            update_status "downloading" 20 "Mengunduh video"

            if [ "$RESOLUTION" = "best" ]; then
              SELECTOR="bv*+ba/b"
            else
              SELECTOR="bv*[height<=${RESOLUTION}]+ba/b[height<=${RESOLUTION}]"
            fi

            yt-dlp \
              -f "$SELECTOR" \
              --merge-output-format mp4 \
              --no-playlist \
              -o "output.%(ext)s" \
              "$VIDEO_URL"
          fi

          FILE=$(find . -maxdepth 1 -type f \
            \( -name "output.mp4" \
            -o -name "output.mp3" \
            -o -name "output.mkv" \
            -o -name "output.webm" \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "File hasil tidak ditemukan"
            exit 1
          fi

          update_status "uploading" 75 "Mengunggah file"

          gh release upload "$TAG" "$FILE"

          FILE_NAME=$(basename "$FILE")

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE_NAME}"

          NOTES=$(jq -nc \
            --arg download_url "$DOWNLOAD_URL" \
            '{status:"completed",progress:100,message:"File siap diunduh",download_url:$download_url}')

          gh release edit "$TAG" \
            --draft=false \
            --notes "$NOTES"

          trap - EXIT

          echo "Download selesai: $DOWNLOAD_URL"
